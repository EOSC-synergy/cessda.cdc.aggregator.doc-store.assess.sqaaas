      github.com/cessda/cessda.cdc.aggregator.doc-store get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.raspberry_sarcastic_cockatoo.sh
        container: qc.ver_raven_harmonious_frog
timeout: 5400
